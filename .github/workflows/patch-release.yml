name: Publish HTML patch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: html-patch-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate release source
        run: |
          python -X utf8 tests/check_release_files.py --git
          python -X utf8 scripts/run_checks.py
      - name: Package and publish patch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, urllib.request, zipfile
          tag = 'v1.14.1-preview.1'
          base = 'v1.14.0-preview.1'
          root = pathlib.Path('.')
          out = root / 'dist'
          out.mkdir(exist_ok=True)
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          names = sorted(n for n in names if n)
          archive = out / ('analyze-stocks-' + tag + '.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  info = zipfile.ZipInfo('analyze-stocks/' + name, (2026, 10, 16, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, (root / name).read_bytes())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for name in names:
                  assert z.read('analyze-stocks/' + name) == (root / name).read_bytes()
          patch = out / ('analyze-stocks-' + tag + '.patch')
          patch.write_bytes(subprocess.check_output(['git', 'diff', '--binary', base, os.environ['RELEASE_COMMIT'], '--']))
          sums = out / 'SHA256SUMS.txt'
          sums.write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in [archive, patch]), encoding='utf-8')
          body = '''HTML修正patch；發布套件1.14.1-preview.1，HTML呈現器1.0.1。研究技能及規則相容版本維持1.14.0。

          - 修正iPhone Safari章節操作、手機直式卡片表格、欄名、證據排列與桌面／平板寬度。
          - 原生章節連結及無JavaScript閱讀；增強控制項於初始化完成後顯示。
          - iPhone實機版面與章節操作已由使用者驗收。完整鍵盤、圖表互動與列印等其餘瀏覽器驗收仍待完成，保留Pre-release。
          - 發布前完整回歸與LF checkout檢查通過；跨平台CI及詳細變更請見本提交Actions與CHANGELOG。
          - ZIP為完整安裝包，解壓後保留analyze-stocks/及相對路徑；patch相對v1.14.0-preview.1，SHA256SUMS.txt涵蓋兩者。
          - 安裝包只含公開來源與合成案例，不含個人研究報告或截圖。
          '''
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def request(url, payload, content_type='application/json'):
              req = urllib.request.Request(url, data=payload, headers=dict(headers, **{'Content-Type': content_type}), method='POST')
              with urllib.request.urlopen(req) as res:
                  return json.load(res)
          release = request(api + '/releases', json.dumps({'tag_name': tag, 'target_commitish': os.environ['RELEASE_COMMIT'], 'name': tag + ' — HTML行動版修正', 'body': body, 'draft': True, 'prerelease': True}).encode())
          upload = release['upload_url'].split('{')[0]
          for p in [archive, patch, sums]:
              result = request(upload + '?name=' + p.name, p.read_bytes(), 'application/zip' if p == archive else 'application/octet-stream')
              assert result['size'] == p.stat().st_size
              assert result.get('digest') == 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest()
          req = urllib.request.Request(api + '/releases/' + str(release['id']), data=json.dumps({'draft': False}).encode(), headers=dict(headers, **{'Content-Type': 'application/json'}), method='PATCH')
          with urllib.request.urlopen(req) as res:
              published = json.load(res)
          assert not published['draft'] and published['prerelease']
          print(published['html_url'])
